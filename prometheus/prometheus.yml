# =============================================================================
# Prometheus Configuration
# =============================================================================
# This file configures Prometheus scraping, alerting, and rule evaluation.
#
# TEMPLATE NOTE: To adapt this for a different environment:
#   1. Add/remove scrape jobs under scrape_configs
#   2. Update target addresses to match your service names/IPs
#   3. Adjust external_labels to reflect your environment (staging, prod, etc.)
#   4. Modify relabel_configs to add custom metadata labels
# =============================================================================

# -----------------------------------------------------------------------------
# Global Configuration
# -----------------------------------------------------------------------------
# These settings apply to all scrape jobs unless overridden per-job.
# -----------------------------------------------------------------------------
global:
  scrape_interval: 15s # How often to scrape targets for metrics
  evaluation_interval: 10s # How often to evaluate alert rules
  scrape_timeout: 10s # Timeout for each scrape request

  # External labels are attached to all metrics and alerts sent to external
  # systems (federation, remote write, Alertmanager). Use these to identify
  # which environment/region the metrics come from.
  # TEMPLATE NOTE: Change these values per deployment environment.
  external_labels:
    environment: "development" # e.g., development, staging, production
    region: "local" # e.g., us-east-1, eu-west-1, local
    cluster: "docker-compose" # e.g., k8s-prod, docker-compose, bare-metal

# -----------------------------------------------------------------------------
# Rule Files
# -----------------------------------------------------------------------------
# Prometheus loads alerting and recording rules from these files.
# Rules are re-evaluated at the global evaluation_interval (10s).
# -----------------------------------------------------------------------------
rule_files:
  - rules.yml

# -----------------------------------------------------------------------------
# Alertmanager Integration
# -----------------------------------------------------------------------------
# Prometheus sends firing alerts to Alertmanager for routing and notification.
# In a Docker Compose setup, "alertmanager" resolves to the container hostname.
# TEMPLATE NOTE: For external Alertmanager, replace with the actual host:port.
# -----------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# =============================================================================
# Scrape Configurations
# =============================================================================
# Each job defines a group of targets to scrape and how to process their
# metrics. Prometheus auto-adds the labels job="<job_name>" and
# instance="<host>:<port>" to every metric.
#
# TEMPLATE NOTE: To add a new service to monitor:
#   1. Copy one of the job blocks below
#   2. Set job_name to a descriptive identifier
#   3. Set targets to the service's host:port
#   4. Optionally add relabel_configs for custom labels
# =============================================================================
scrape_configs:
  # ---------------------------------------------------------------------------
  # Job: Prometheus Self-Monitoring
  # ---------------------------------------------------------------------------
  # Prometheus scrapes its own /metrics endpoint so you can monitor
  # Prometheus itself (scrape durations, sample counts, memory usage, etc.)
  # ---------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: "monitoring" # Custom label for grouping in dashboards

  # ---------------------------------------------------------------------------
  # Job: Node Exporter — Host-Level Metrics
  # ---------------------------------------------------------------------------
  # Collects CPU, memory, disk, network, and filesystem metrics from the host.
  # Metric prefixes: node_cpu_*, node_memory_*, node_disk_*, node_network_*,
  #                  node_filesystem_*, node_load*
  #
  # scrape_interval override: 10s for more granular host monitoring
  # ---------------------------------------------------------------------------
  - job_name: node_exporter
    scrape_interval: 10s # Override: scrape host metrics more frequently
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: "infrastructure" # Custom label for grouping

  # ---------------------------------------------------------------------------
  # Job: cAdvisor — Container-Level Metrics
  # ---------------------------------------------------------------------------
  # Collects per-container CPU, memory, network, and disk I/O metrics from
  # the Docker daemon via cAdvisor.
  # Metric prefixes: container_cpu_*, container_memory_*, container_network_*,
  #                  container_fs_*
  #
  # metric_relabel_configs:
  #   Drops high-cardinality container metrics that consume excessive storage
  #   and are rarely needed. This is a best-practice for cAdvisor in production.
  #
  # TEMPLATE NOTE: Adjust the metric_relabel_configs drop list based on which
  # metrics you actually use in your dashboards and alerts.
  # ---------------------------------------------------------------------------
  - job_name: cadvisor
    scrape_interval: 10s # Override: scrape container metrics more frequently
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: "infrastructure"
    # Drop noisy/high-cardinality metrics to save storage and improve performance
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "container_(tasks_state|last_seen|memory_failures_total)"
        action: drop
      # Drop metrics from the cAdvisor container itself (monitoring the monitor)
      - source_labels: [name]
        regex: ""
        action: drop

  # ---------------------------------------------------------------------------
  # Job: Application Server — Custom App Metrics
  # ---------------------------------------------------------------------------
  # Scrapes the sample Go application's /metrics endpoint for custom
  # application metrics (e.g., ping_request_count).
  #
  # TEMPLATE NOTE: Replace or duplicate this job for your own application(s).
  # Any app that exposes a Prometheus-compatible /metrics endpoint can be
  # added here.
  # ---------------------------------------------------------------------------
  - job_name: simple_server
    static_configs:
      - targets: ["server:8090"]
        labels:
          component: "application"
