# =============================================================================
# Loki Configuration
# =============================================================================
# Loki is a horizontally-scalable, highly-available log aggregation system
# inspired by Prometheus. It indexes log metadata (labels) rather than full
# text, making it lightweight and cost-effective.
#
# This config uses local filesystem storage suitable for single-node
# deployments. For production clusters, switch to object storage (S3/GCS).
# =============================================================================

auth_enabled: false # Disable multi-tenancy (single-tenant mode)

server:
  http_listen_port: 3100 # API and push endpoint
  grpc_listen_port: 9096 # Internal gRPC communication

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# -----------------------------------------------------------------------------
# Schema Configuration
# -----------------------------------------------------------------------------
# Defines how Loki stores and indexes log data.
# v12 schema with boltdb-shipper is the stable choice for Loki 2.x.
# -----------------------------------------------------------------------------
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h

# -----------------------------------------------------------------------------
# Storage Configuration
# -----------------------------------------------------------------------------
# Uses local filesystem with BoltDB shipper for single-node deployment.
# -----------------------------------------------------------------------------
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# -----------------------------------------------------------------------------
# Limits Configuration
# -----------------------------------------------------------------------------
# Controls ingestion and query limits to prevent resource exhaustion.
# -----------------------------------------------------------------------------
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h # Reject logs older than 7 days
  ingestion_rate_mb: 16 # Max ingestion rate per tenant (MB/s)
  ingestion_burst_size_mb: 32 # Burst allowance

# -----------------------------------------------------------------------------
# Compactor Configuration
# -----------------------------------------------------------------------------
# The compactor merges index files and enforces retention policies.
# -----------------------------------------------------------------------------
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h

# -----------------------------------------------------------------------------
# Table Manager / Retention
# -----------------------------------------------------------------------------
# Retention period controls how long logs are kept before deletion.
# -----------------------------------------------------------------------------
table_manager:
  retention_deletes_enabled: true
  retention_period: 168h # Keep logs for 7 days

# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------
analytics:
  reporting_enabled: false
